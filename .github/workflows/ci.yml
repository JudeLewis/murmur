name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Build the iPhone app and keyboard
        run: >
          xcodebuild -project iPhone/Murmur.xcodeproj -scheme MurmurPhone -configuration Release
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -quiet build
